version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor
